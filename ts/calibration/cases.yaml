# Zestaw kalibracyjny ts-packu.
#
# Przypadek analogiczny do PyPI (`halucynowany-pakiet-npm`, niepoprawny pakiet
# npm) NIE żyje tutaj — testuje wyłącznie G1.deps/G3.sca, które są w pełni
# core-owe (npm/PyPI/NuGet rejestrowane przez `llm-code-gatekeeper-core`
# samo, patrz jego `calibration/cases.yaml`).
#
# Uruchomienie: `gatekeeper calibrate` (wymaga zainstalowanego
# `llm-code-gatekeeper-core`, `eslint`, `@typescript-eslint/parser`,
# a dla przypadku G2 także `vitest` — patrz `requires_tools` per przypadek)

cases:
  - name: test-bez-dowodu
    description: >-
      Nowy test asertuje zachowanie, które w tym PR-ze się nie zmieniło
      (`add`, podczas gdy zmianą jest `classify`) — musi przejść na kodzie
      sprzed zmiany, czyli wyzwolić `tests.pass_on_pre_change_code`
      (G2.cross_verify, TsTestToolchain). G2.cross_verify jest w `warn_only`,
      więc oczekiwany werdykt to PASS z ostrzeżeniem, nie BLOCK —
      analogicznie do `test-bez-dowodu` w python- i csharp-packu.

      Fixture nie wozi `node_modules`: `vitest.config.js` włącza `globals`,
      a testowy plik nie importuje niczego spoza repo, więc wystarcza vitest
      z instalacji globalnej (stąd `requires_tools: [vitest]`).
    fixture: test-bez-dowodu
    requires_tools: [vitest, node]
    expect:
      verdict: PASS
      warning_rules: [tests.pass_on_pre_change_code]

  - name: zlozonosc-powyzej-progu
    description: >-
      Nowa funkcja z 10 zagnieżdżonymi `if` (M=11) — powyżej progu McCabe
      10 (G1.complexity, TsComplexityAnalyzer, reguła `complexity` eslinta
      z progiem 1). G1.complexity NIE jest w `warn_only` — musi blokować
      naprawdę, nie tylko ostrzegać (analogicznie do python-packu).
    fixture: zlozonosc-powyzej-progu
    requires_tools: [eslint]
    expect:
      verdict: BLOCK
      blocking_rules: [complexity.max]
