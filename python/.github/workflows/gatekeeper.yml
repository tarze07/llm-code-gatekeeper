name: gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened]

# UWAGA: `pull_request` nie daje sekretów ani zapisu PR-om z forków — to
# świadomy wybór. Dla forków trzeba rozdzielić przebieg na `pull_request`
# (liczenie) i `workflow_run` (komentowanie). Dopóki repozytorium jest
# wewnętrzne, ten prostszy wariant wystarcza.
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: gatekeeper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base wymaga pełnej historii

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Odkomentuj i dostosuj, jeśli oceniane repo zawiera TS/JS albo C# —
      # G1.static/G3.sca wtedy realnie coś sprawdzą zamiast dawać `pass` bez
      # dowodu (brak `tsconfig.json`/configu eslinta/`.csproj` to co innego
      # niż brak samego narzędzia, ale bez node/dotnet w PATH brama i tak nie
      # ma czym uruchomić tsc/eslint/`dotnet build`).
      # - uses: actions/setup-node@v4
      #   with: { node-version: "22" }
      # - run: npm ci   # albo: npm install --global typescript eslint
      # - uses: actions/setup-dotnet@v4
      #   with: { dotnet-version: "8.0.x" }
      # - run: dotnet restore   # bramka sama nie ściąga pakietów NuGet
      #
      # Dołóż odpowiedni pack, jeśli oceniane repo zawiera TS/JS albo C# —
      # sam ten workflow instaluje tylko llm-code-gatekeeper-python:
      # - run: pip install --quiet "llm-code-gatekeeper-ts @ git+https://github.com/tarze07/llm-code-gatekeeper.git#subdirectory=ts"
      # - run: pip install --quiet "llm-code-gatekeeper-csharp @ git+https://github.com/tarze07/llm-code-gatekeeper.git#subdirectory=csharp"

      - name: Instalacja bramy
        # CLI (`gatekeeper`) żyje w llm-code-gatekeeper-core, instalowany tu
        # tranzytywnie jako zależność tego pack'a — nie ma osobnej linii.
        # `gates` — ruff/mypy/diff-cover, których G1.static/G2.diff_coverage
        # potrzebują jako podprocesów; semgrep/pip-audit/gitleaks instalowane
        # osobno niżej (core-owe, nie zależności tego pack'a).
        run: |
          pip install --quiet semgrep pip-audit
          pip install --quiet -e ".[dev,gates]"

      - name: Instalacja gitleaksa
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Walidacja polityki
        run: gatekeeper policy lint --policy policy/gates.yaml

      - name: Uruchomienie bramek
        id: gate
        continue-on-error: true
        run: |
          gatekeeper run \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --policy policy/gates.yaml \
            --format markdown \
            --output gatekeeper-report.md \
            --json-report gatekeeper-report.json \
            --fail-on block

      - name: Artefakt z pełnym raportem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-report
          path: |
            gatekeeper-report.md
            gatekeeper-report.json
          retention-days: 30

      - name: Komentarz w PR (aktualizowany, nie mnożony)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # skrypt jest core-owy (llm-code-gatekeeper-core/scripts/), nie tego
        # pack'a — pobierany, nie kopiowany, żeby nie rozjeżdżał się z core.
        run: |
          curl -sSL -o post_pr_comment.sh \
            https://raw.githubusercontent.com/tarze07/llm-code-gatekeeper-core/main/scripts/post_pr_comment.sh
          chmod +x post_pr_comment.sh
          ./post_pr_comment.sh gatekeeper-report.md

      - name: Decyzja
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Brama jakości zablokowała zmianę — szczegóły w komentarzu do PR."
          exit 1
