name: gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened]

# UWAGA: `pull_request` nie daje sekretów ani zapisu PR-om z forków — to
# świadomy wybór. Dla forków trzeba rozdzielić przebieg na `pull_request`
# (liczenie) i `workflow_run` (komentowanie). Dopóki repozytorium jest
# wewnętrzne, ten prostszy wariant wystarcza.
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: gatekeeper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # OPCJA KONTENEROWA:
    # Odkomentuj poniższy blok container, aby uruchamiać analizy w gotowym,
    # w pełni wyizolowanym obrazie narzędzi bramy (container/Dockerfile):
    # container:
    #   image: ghcr.io/tarze07/gatekeeper-tools:0.2.0
    #   env:
    #     GATEKEEPER_SANDBOX: container
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base wymaga pełnej historii

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Odkomentuj i dostosuj, jeśli oceniane repo zawiera TS/JS albo C# —
      # wersje narzędzi są przypięte zgodnie z container/Dockerfile:
      # - uses: actions/setup-node@v4
      #   with: { node-version: "22" }
      # - run: |
      #     npm install --global \
      #       @typescript-eslint/parser@8.69.0 \
      #       eslint@10.8.1 \
      #       typescript@7.0.2 \
      #       vitest@5.0.0
      # - uses: actions/setup-dotnet@v4
      #   with: { dotnet-version: "8.0.x" }
      # - run: dotnet restore   # bramka sama nie ściąga pakietów NuGet

      - name: Izolacja procesów (bubblewrap)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Instalacja bramy i narzędzi
        # Wersje narzędzi przypięte zgodnie z container/Dockerfile
        run: |
          pip install --quiet \
            "semgrep==1.176.0" \
            "pip-audit>=2.7,<3" \
            "ruff==0.16.5" \
            "mypy==2.3.1" \
            "diff-cover==10.5.1"
          pip install --quiet "llm-code-gatekeeper-core>=0.2.0,<0.3.0"
          # Zainstaluj pack(i) dla języków obecnych w repo:
          pip install --quiet "llm-code-gatekeeper-python>=0.2.0,<0.3.0"
          # pip install --quiet "llm-code-gatekeeper-ts>=0.2.0,<0.3.0"
          # pip install --quiet "llm-code-gatekeeper-csharp>=0.2.0,<0.3.0"

      - name: Instalacja gitleaksa
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Walidacja polityki
        run: gatekeeper policy lint --policy policy/gates.yaml

      - name: Uruchomienie bramek
        id: gate
        continue-on-error: true
        run: |
          gatekeeper run \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --policy policy/gates.yaml \
            --format markdown \
            --output gatekeeper-report.md \
            --json-report gatekeeper-report.json \
            --fail-on block

      - name: Artefakt z pełnym raportem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-report
          path: |
            gatekeeper-report.md
            gatekeeper-report.json
          retention-days: 30

      - name: Komentarz w PR (aktualizowany, nie mnożony)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sSL -o post_pr_comment.sh \
            https://raw.githubusercontent.com/tarze07/llm-code-gatekeeper/main/core/scripts/post_pr_comment.sh
          chmod +x post_pr_comment.sh
          ./post_pr_comment.sh gatekeeper-report.md

      - name: Decyzja
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Brama jakości zablokowała zmianę — szczegóły w komentarzu do PR."
          exit 1
