[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-code-gatekeeper-csharp"
version = "0.3.0"
description = "Pack C# dla llm-code-gatekeeper-core: dotnet build (G1.static), reguły „nigdy” SAST, G2.cross_verify/test_sanity/diff_coverage, złożoność cyklomatyczna (G1.complexity)"
requires-python = ">=3.12"
dependencies = [
    "llm-code-gatekeeper-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."gatekeeper.static_checkers"]
csharp = "gatekeeper_csharp.adapters.dotnet:CsharpStaticChecker"

[project.entry-points."gatekeeper.semgrep_rule_packs"]
csharp = "gatekeeper_csharp.adapters.rulepack:CsharpRulePack"

[project.entry-points."gatekeeper.test_toolchains"]
csharp = "gatekeeper_csharp.testing.toolchain:CsharpTestToolchain"

[project.entry-points."gatekeeper.complexity_analyzers"]
csharp = "gatekeeper_csharp.adapters.complexity:CsharpComplexityAnalyzer"

[tool.setuptools.packages.find]
include = ["gatekeeper_csharp*"]

[tool.setuptools.package-data]
gatekeeper_csharp = ["rules/semgrep/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
