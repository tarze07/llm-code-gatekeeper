[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-code-gatekeeper-web"
version = "0.1.0"
description = "Panel WWW dla llm-code-gatekeeper-core: raporty, kolejka kontroli, oceny i polityki"
requires-python = ">=3.12"
dependencies = [
    "llm-code-gatekeeper-core>=0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # Formularz importu wysyła plik jako `multipart/form-data`; Starlette
    # potrzebuje do tego osobnego parsera i nie ciągnie go jako zależności.
    "python-multipart>=0.0.9",
    # `gatekeeper-web` (CLI panelu) — ten sam framework co CLI core'a.
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # `fastapi.testclient` stoi na httpx — bez niego testy API nie wstaną.
    "httpx>=0.27",
]

[project.scripts]
gatekeeper-web = "gatekeeper_web.cli:main"

[tool.setuptools.packages.find]
include = ["gatekeeper_web*"]

[tool.setuptools.package-data]
# Zbudowany CSS/JS jedzie w kole — użytkownik panelu nie instaluje Node.js
# (źródła TypeScriptu żyją w `frontend/`, patrz README.md §Zasoby).
gatekeeper_web = ["templates/*.html", "static/*.css", "static/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI buduje sygnatury endpointów z wartości domyślnych (Depends/Query/Form)
# — B008 nie ma tu zastosowania, dokładnie jak w `core/gatekeeper_core/cli.py`.
"gatekeeper_web/api/v1.py" = ["B008"]
"gatekeeper_web/api/v2_endpoints.py" = ["B008"]
"gatekeeper_web/pages.py" = ["B008"]
# To samo w CLI panelu — typer buduje interfejs z wartości domyślnych.
"gatekeeper_web/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
